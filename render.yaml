# Render Blueprint — PySQA Web (single web service: FastAPI + built frontend)
# Starter plan: 512 MB, 0.5 CPU. The disk is ephemeral, so sessions are lost on every restart and
# deploy; the browser keeps a copy of the uploaded files and puts them back on its own.
services:
  - type: web
    name: pysqa-web
    runtime: python
    plan: starter
    region: oregon
    branch: main
    buildCommand: pip install -r backend/requirements.txt && npm ci --prefix frontend && npm run build --prefix frontend
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
